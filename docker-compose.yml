services:
  database:
    image: postgis/postgis:16-3.4
    container_name: bandung-crime-postgis
    environment:
      POSTGRES_DB: bandung_crime
      POSTGRES_USER: bandung_crime
      POSTGRES_PASSWORD: bandung_crime_dev
    ports:
      - "5434:5432"
    volumes:
      - bandung_crime_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandung_crime -d bandung_crime"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bandung_crime_postgis_data:
