services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bootstrap:
    image: bandung-crime-python-runtime:staging
    command: ["/bin/sh", "-c", "python -m scripts.migrate_csv_to_postgres --skip-backup && python -m scripts.import_osm_roads"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    image: bandung-crime-python-runtime:staging
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: https://${PWA_DOMAIN}
      CORS_ORIGIN_REGEX: ^https://[a-z0-9-]+\.vercel\.app$
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  moderator:
    image: bandung-crime-python-runtime:staging
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODERATOR_NAME: ${MODERATOR_NAME}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD}
      PWA_REPORT_URL: https://${PWA_DOMAIN}/lapor
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_SITE_ADDRESS: ${API_DOMAIN}
      MODERATOR_SITE_ADDRESS: ${MODERATOR_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      moderator:
        condition: service_started
    restart: unless-stopped

volumes:
  staging_postgis_data:
  caddy_data:
  caddy_config:
